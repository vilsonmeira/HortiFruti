<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2e7d32">
<title>Hortifruti PDV | Vendas</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f7f3}.pagina-vendas{max-width:1400px;margin:24px auto;padding:0 16px}.painel{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 8px #0001}.topo-vendas{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}.filtros input,.filtros select{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#f8faf5;padding:14px;border-left:4px solid #2e7d32;border-radius:8px}.card strong{display:block;color:#2e7d32;font-size:1.35rem;margin-top:5px}.tabela-wrap{overflow:auto}.tabela{width:100%;border-collapse:collapse;min-width:760px}.tabela th,.tabela td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left}.tabela th{background:#f8faf5;color:#2e7d32}.btn{padding:9px 13px;border:0;border-radius:7px;cursor:pointer;font-weight:600}.primario{background:#2e7d32;color:#fff}.neutro{background:#e8eee6;color:#263326}.acao{padding:5px 9px;margin:2px;border:0;border-radius:5px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.aberto{display:flex}.modal-conteudo{background:#fff;border-radius:12px;padding:22px;max-width:620px;width:100%;max-height:85vh;overflow:auto}.linha{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.vazio{text-align:center;padding:30px;color:#777}@media(max-width:600px){.pagina-vendas{padding:0 8px}.painel{padding:14px}}
</style>
</head>
<body>
<header class="cabecalho"><div class="logo"><span class="fruta">🍉</span><h1>Hortifruti <span>Vendas</span></h1><span class="fruta">🍎</span></div><div class="navegacao"><a href="index.html">🛒 PDV</a> <a href="gestao.html">⚙️ Gestão</a></div></header>
<main class="pagina-vendas"><section class="painel">
<div class="topo-vendas"><div><h2>💰 Consulta de Vendas</h2><p>Histórico independente do cadastro de compras e do estoque.</p></div><button class="btn neutro" onclick="limparFiltros()">Limpar filtros</button></div>
<div class="cards"><div class="card">Vendas encontradas<strong id="qtd-vendas">0</strong></div><div class="card">Total vendido<strong id="total-vendido">R$ 0,00</strong></div><div class="card">Ticket médio<strong id="ticket-medio">R$ 0,00</strong></div></div>
<div class="filtros"><input id="busca" placeholder="Buscar nº da venda ou produto"><input id="data-inicio" type="date" aria-label="Data inicial"><input id="data-fim" type="date" aria-label="Data final"><select id="pagamento"><option value="">Todas as formas de pagamento</option></select></div>
<div class="tabela-wrap"><table class="tabela"><thead><tr><th>Venda</th><th>Data e hora</th><th>Itens</th><th>Subtotal</th><th>Desconto</th><th>Total</th><th>Pagamento</th><th>Ações</th></tr></thead><tbody id="lista-vendas"></tbody></table></div>
</section></main>
<div class="modal" id="modal-detalhe" role="dialog" aria-modal="true"><div class="modal-conteudo"><div class="topo-vendas"><h3 id="titulo-detalhe">Detalhes da venda</h3><button class="btn neutro" onclick="fecharDetalhe()">Fechar ✕</button></div><div id="conteudo-detalhe"></div></div></div>
<script>
const dinheiro=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let vendas=[];try{const raw=JSON.parse(localStorage.getItem('historicoVendas')||'[]');vendas=Array.isArray(raw)?raw:[]}catch(e){console.error(e);vendas=[]}
const $=id=>document.getElementById(id);
function dataBR(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('pt-BR')}
function formas(){const s=$('pagamento');[...new Set(vendas.map(v=>String(v.formaPagamento||'Não informado')))].sort().forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;s.appendChild(o)})}
function filtradas(){const termo=$('busca').value.trim().toLocaleLowerCase('pt-BR'),ini=$('data-inicio').value,fim=$('data-fim').value,pag=$('pagamento').value;return vendas.filter(v=>{const d=new Date(v.data);const dia=Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);const texto=[v.id,v.formaPagamento,...(v.itens||[]).map(i=>i.nome)].join(' ').toLocaleLowerCase('pt-BR');return(!termo||texto.includes(termo))&&(!ini||dia>=ini)&&(!fim||dia<=fim)&&(!pag||String(v.formaPagamento||'Não informado')===pag)}).sort((a,b)=>new Date(b.data)-new Date(a.data))}
function render(){const lista=filtradas(),total=lista.reduce((s,v)=>s+(Number(v.total)||0),0);$('qtd-vendas').textContent=lista.length;$('total-vendido').textContent=dinheiro(total);$('ticket-medio').textContent=dinheiro(lista.length?total/lista.length:0);$('lista-vendas').innerHTML=lista.length?lista.map(v=>'<tr><td>#'+escapeHTML(v.id)+'</td><td>'+escapeHTML(dataBR(v.data))+'</td><td>'+((v.itens||[]).length)+'</td><td>'+dinheiro(v.subtotal)+'</td><td>'+dinheiro(v.desconto)+'</td><td><strong>'+dinheiro(v.total)+'</strong></td><td>'+escapeHTML(v.formaPagamento||'Não informado')+(v.bandeira?' · '+escapeHTML(v.bandeira):'')+'</td><td><button class="acao primario" onclick="detalhar('+Number(v.id)+')">Detalhes</button><button class="acao neutro" onclick="reimprimir('+Number(v.id)+')">Cupom</button></td></tr>').join(''):'<tr><td colspan="8" class="vazio">Nenhuma venda encontrada.</td></tr>'}
function detalhar(id){const v=vendas.find(x=>Number(x.id)===Number(id));if(!v)return;$('titulo-detalhe').textContent='Venda #'+v.id;$('conteudo-detalhe').innerHTML='<p><strong>Data:</strong> '+escapeHTML(dataBR(v.data))+'</p><p><strong>Pagamento:</strong> '+escapeHTML(v.formaPagamento||'Não informado')+(v.bandeira?' — '+escapeHTML(v.bandeira):'')+'</p><h4>Produtos</h4>'+((v.itens||[]).map(i=>'<div class="linha"><span>'+escapeHTML(i.nome)+' · '+Number(i.quantidade||0).toLocaleString('pt-BR')+' '+escapeHTML(i.unidade||'')+'</span><strong>'+dinheiro(Number(i.preco||0)*Number(i.quantidade||0))+'</strong></div>').join('')||'<p>Itens não disponíveis.</p>')+'<div class="linha"><span>Subtotal</span><strong>'+dinheiro(v.subtotal)+'</strong></div><div class="linha"><span>Desconto</span><strong>'+dinheiro(v.desconto)+'</strong></div><div class="linha"><strong>Total</strong><strong>'+dinheiro(v.total)+'</strong></div>';$('modal-detalhe').classList.add('aberto')}
function fecharDetalhe(){$('modal-detalhe').classList.remove('aberto')}
function reimprimir(id){const v=vendas.find(x=>Number(x.id)===Number(id));if(!v)return;let cupom=v.cupomTexto;if(!cupom){const itens=(v.itens||[]).map(i=>i.nome+'\n'+i.quantidade+' '+i.unidade+' x '+dinheiro(i.preco)+' = '+dinheiro(i.preco*i.quantidade)).join('\n');cupom='HORTIFRUTI\nVENDA Nº '+v.id+'\n'+dataBR(v.data)+'\n------------------------------\n'+itens+'\n------------------------------\nTOTAL: '+dinheiro(v.total)+'\nPAGAMENTO: '+(v.formaPagamento||'')+'\nOBRIGADO! VOLTE SEMPRE!'}const w=window.open('','_blank','width=360,height=600');if(!w)return alert('Permita pop-ups para reimprimir.');const pre=w.document.createElement('pre');pre.style.cssText='font:12px monospace;white-space:pre-wrap;margin:0';pre.textContent=cupom;w.document.body.appendChild(pre);w.document.close();w.focus();w.print()}
function limparFiltros(){$('busca').value='';$('data-inicio').value='';$('data-fim').value='';$('pagamento').value='';render()}
['busca','data-inicio','data-fim','pagamento'].forEach(id=>$(id).addEventListener(id==='busca'?'input':'change',render));formas();render();
</script>
</body></html>
